name: Compiler l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Préparer la structure Android (les fichiers du dépôt restent à la racine)
        run: |
          mkdir -p proj/app/src/main/java/com/kouame/appelpredictions
          cp ./*.java proj/app/src/main/java/com/kouame/appelpredictions/
          cp AndroidManifest.xml proj/app/src/main/AndroidManifest.xml
          cp app.gradle proj/app/build.gradle
          cp build.gradle settings.gradle gradle.properties proj/

      - name: Compiler
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AppelPredictions-apk
          path: proj/app/build/outputs/apk/debug/*.apk
