plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kouame.appelpredictions'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kouame.appelpredictions'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
