plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.kouame.appelpredictions'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kouame.appelpredictions'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java {
                srcDirs = ['.']
                include '*.java'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
